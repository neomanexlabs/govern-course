name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      - name: identifier check
        run: |
          ! grep -rniE 'pkg\.dev|gcr\.io|gitlab\.com|@neomanex\.com' --exclude-dir=.git --exclude-dir=.github .
          ! grep -rn $'\xe2\x80\x94' --exclude-dir=.git .
